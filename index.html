<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sol e Lua Store — Moda feminina</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1428;
  --surface:#101F3D;
  --ink:#EAF1FB;
  --ink-soft:#93A8D4;
  --line:#22345C;
  --line-strong:#32477A;
  --gold:#8FB8E8;
  --gold-deep:#5C8FE0;
  --gold-light:#16264A;
  --blush:#16264A;
  --blush-2:#1C2E56;
  --error:#E0655A;
  --error-bg:#3B1E20;
  --success:#5FCB9A;
  --success-bg:#123526;
  --deep:#050B18;
  --radius-s:2px;
  --radius-m:3px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Jost', 'Helvetica Neue', Arial, sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060D1C; --surface:#0C1830; --ink:#EAF1FB; --ink-soft:#8DA3D1;
    --line:#1C2C50; --line-strong:#2A3D68; --gold:#9AC3EE; --gold-deep:#6C9BE8;
    --gold-light:#111F3E; --blush:#111F3E; --blush-2:#16264A;
    --error-bg:#33191C; --success-bg:#0F2E21; --deep:#03060D;
  }
}
:root[data-theme="dark"]{
  --bg:#060D1C; --surface:#0C1830; --ink:#EAF1FB; --ink-soft:#8DA3D1;
  --line:#1C2C50; --line-strong:#2A3D68; --gold:#9AC3EE; --gold-deep:#6C9BE8;
  --gold-light:#111F3E; --blush:#111F3E; --blush-2:#16264A;
  --error-bg:#33191C; --success-bg:#0F2E21; --deep:#03060D;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-weight:400; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:0.95rem;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:500; margin:0; letter-spacing:.01em; color:var(--ink);}
p{margin:0;}
::selection{background:var(--gold-light);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
.wrap{max-width:1240px; margin:0 auto; padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 18px;}}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; border-radius:var(--radius-s); transition:background .2s ease, color .2s ease, border-color .2s ease; white-space:nowrap;}
.btn:hover{background:var(--gold-deep); border-color:var(--gold-deep); color:#fff;}
.btn-outline{background:transparent; color:var(--ink); border:1px solid var(--ink);}
.btn-outline:hover{background:var(--ink); color:var(--bg);}
.btn-gold{background:var(--gold); border-color:var(--gold); color:#fff;}
.btn-gold:hover{background:var(--gold-deep); border-color:var(--gold-deep);}
.btn-ghost{background:transparent; border:1px solid transparent; color:var(--ink-soft); text-transform:none; letter-spacing:0; padding:8px 10px;}
.btn-ghost:hover{color:var(--ink); background:var(--blush);}
.btn-sm{padding:8px 16px; font-size:.74rem;}
.btn-danger{border-color:var(--error); color:var(--error); background:transparent;}
.btn-danger:hover{background:var(--error); color:#fff;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn:disabled:hover{background:var(--ink); border-color:var(--ink); color:var(--bg);}

/* header */
.topbar{background:var(--deep); color:var(--ink); font-size:.76rem; letter-spacing:.04em; text-align:center; padding:8px 12px;}
header.site{position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--line);}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:24px;}
.logo{font-family:var(--font-display); font-size:1.5rem; letter-spacing:.03em; font-weight:500; display:flex; align-items:center; gap:10px;}
.logo img{width:38px; height:38px; object-fit:cover; border-radius:50%; box-shadow:0 0 14px rgba(143,184,232,.5);}
.logo-text{display:flex; flex-direction:column; line-height:1.05;}
.logo small{font-family:var(--font-body); font-size:.6rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-deep); display:block; margin-top:2px;}
nav.main-menu{display:flex; gap:30px; font-size:.86rem;}
nav.main-menu a{position:relative; padding:4px 0; color:var(--ink-soft); transition:color .15s;}
nav.main-menu a:hover, nav.main-menu a.active{color:var(--ink);}
nav.main-menu a.active::after{content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:var(--gold);}
.nav-actions{display:flex; align-items:center; gap:6px;}
.icon-btn{position:relative; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--ink); background:none; border:none;}
.icon-btn:hover{background:var(--blush);}
.icon-btn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.4;}
.cart-badge{position:absolute; top:2px; right:2px; background:var(--gold-deep); color:#fff; font-size:.62rem; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-body);}
.search-wrap{position:relative; flex:1; max-width:340px; display:flex; align-items:center;}
.search-wrap input{width:100%; border:1px solid var(--line); background:var(--surface); padding:9px 14px 9px 36px; border-radius:20px; color:var(--ink);}
.search-wrap svg{position:absolute; left:12px; width:15px; height:15px; stroke:var(--ink-soft); fill:none; stroke-width:1.6;}
.burger{display:none; width:38px; height:38px; align-items:center; justify-content:center; background:none; border:none; color:var(--ink);}
.burger svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.5;}
@media(max-width:920px){
  nav.main-menu{display:none;}
  .search-wrap{display:none;}
  .burger{display:flex;}
}
.mobile-menu{display:none; flex-direction:column; border-top:1px solid var(--line); padding:16px 0;}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:12px 0; border-bottom:1px solid var(--line); font-size:.95rem;}
.mobile-menu .m-search{margin:10px 0;}
.mobile-menu .m-search input{width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:20px;}

/* hero */
.hero{display:grid; grid-template-columns:1.05fr .95fr; align-items:center; gap:40px; padding:64px 0 70px;}
.hero-copy .eyebrow{font-size:.78rem; letter-spacing:.14em; color:var(--gold-deep); margin-bottom:18px; display:block;}
.hero-copy h1{font-size:3.4rem; line-height:1.05; max-width:9.5em;}
.hero-copy h1 em{font-style:italic; color:var(--gold-deep);}
.hero-copy p{margin-top:22px; max-width:34ch; color:var(--ink-soft); font-size:1.02rem;}
.hero-copy .cta-row{margin-top:32px; display:flex; gap:14px; flex-wrap:wrap;}
.hero-visual{position:relative; aspect-ratio:4/5; border-radius:var(--radius-m); overflow:hidden; background:linear-gradient(150deg,var(--blush),var(--blush-2)); display:flex; align-items:center; justify-content:center;}
.hero-visual svg{width:62%; height:62%; stroke:var(--gold-deep); fill:none; stroke-width:1;}
@media(max-width:920px){.hero{grid-template-columns:1fr; padding:36px 0 44px;} .hero-copy h1{font-size:2.4rem;} .hero-visual{order:-1;}}

/* sections */
.section{padding:56px 0;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:30px; gap:20px;}
.section-head h2{font-size:1.9rem;}
.section-head p{color:var(--ink-soft); font-size:.92rem; margin-top:6px;}
.section-head a{font-size:.82rem; color:var(--gold-deep); border-bottom:1px solid var(--gold-deep); padding-bottom:2px; white-space:nowrap;}
.divider{height:1px; background:var(--line); border:none; margin:0;}

/* product grid */
.grid-products{display:grid; grid-template-columns:repeat(4,1fr); gap:28px 22px;}
@media(max-width:980px){.grid-products{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.grid-products{grid-template-columns:repeat(2,1fr); gap:20px 14px;}}
.card-product{display:flex; flex-direction:column;}
.card-photo{position:relative; aspect-ratio:3/4; border-radius:var(--radius-m); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.card-photo svg{width:52%; height:52%; stroke:var(--gold-deep); fill:none; stroke-width:1.1; opacity:.85;}
.card-photo .tag{position:absolute; top:10px; left:10px; background:var(--ink); color:var(--bg); font-size:.62rem; letter-spacing:.07em; text-transform:uppercase; padding:5px 9px; border-radius:20px;}
.card-photo .tag.promo{background:var(--error);}
.card-photo .fav{position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; border:none;}
.card-photo .fav svg{width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.5;}
.card-photo .fav.active svg{fill:var(--error); stroke:var(--error);}
.card-product h3{font-size:.98rem; font-weight:500; margin-bottom:4px;}
.card-cat{font-size:.72rem; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px;}
.price-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.price-old{font-size:.82rem; color:var(--ink-soft); text-decoration:line-through;}
.price-now{font-size:1.02rem; font-weight:500; color:var(--ink);}
.price-now.promo{color:var(--error);}
.installment{font-size:.74rem; color:var(--ink-soft); margin-top:3px;}
.stock-tag{font-size:.72rem; margin-top:4px;}
.stock-tag.low{color:var(--error);}
.stock-tag.out{color:var(--ink-soft);}

/* category strip */
.cat-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:14px;}
@media(max-width:920px){.cat-strip{grid-template-columns:repeat(4,1fr);}}
@media(max-width:560px){.cat-strip{grid-template-columns:repeat(3,1fr);}}
.cat-tile{border:1px solid var(--line); border-radius:var(--radius-m); padding:20px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; background:var(--surface); transition:border-color .15s;}
.cat-tile:hover{border-color:var(--gold);}
.cat-tile svg{width:30px; height:30px; stroke:var(--gold-deep); fill:none; stroke-width:1.2;}
.cat-tile span{font-size:.8rem;}

/* promo banner */
.promo-banner{background:var(--deep); color:var(--ink); border-radius:var(--radius-m); padding:52px 48px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
.promo-banner h2{color:var(--bg); font-size:2rem; max-width:14ch;}
.promo-banner p{color:#AEC0E8; margin-top:10px; max-width:36ch;}
.promo-banner .btn{background:var(--gold); border-color:var(--gold);}

/* footer */
footer.site{background:var(--blush); border-top:1px solid var(--line); margin-top:60px;}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1.2fr; gap:36px; padding:56px 0 34px;}
@media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.footer-grid{grid-template-columns:1fr;}}
.footer-grid h4{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:16px;}
.footer-grid p, .footer-grid a{font-size:.86rem; color:var(--ink-soft); display:block; margin-bottom:9px;}
.footer-grid a:hover{color:var(--ink);}
.footer-social{display:flex; gap:10px; margin-top:6px;}
.footer-social a{width:34px; height:34px; border:1px solid var(--line-strong); border-radius:50%; display:flex; align-items:center; justify-content:center;}
.footer-social svg{width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:1.3;}
.footer-bottom{border-top:1px solid var(--line-strong); padding:18px 0; font-size:.76rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* breadcrumb */
.crumbs{font-size:.78rem; color:var(--ink-soft); padding:20px 0 0;}
.crumbs a:hover{color:var(--ink);}

/* filters layout */
.shop-layout{display:grid; grid-template-columns:230px 1fr; gap:36px; padding:26px 0 70px;}
@media(max-width:840px){.shop-layout{grid-template-columns:1fr;}}
.filters{position:sticky; top:90px; align-self:start;}
.filter-group{border-bottom:1px solid var(--line); padding:18px 0;}
.filter-group h4{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;}
.filter-opt{display:flex; align-items:center; gap:9px; margin-bottom:10px; font-size:.88rem; color:var(--ink-soft); cursor:pointer;}
.filter-opt input{accent-color:var(--gold-deep);}
.filter-opt:hover{color:var(--ink);}
.price-inputs{display:flex; align-items:center; gap:8px;}
.price-inputs input{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--surface); color:var(--ink);}
.shop-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.shop-toolbar select{padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--surface); color:var(--ink);}
.result-count{font-size:.86rem; color:var(--ink-soft);}
.mobile-filter-toggle{display:none;}
@media(max-width:840px){
  .filters{position:static; display:none;}
  .filters.open{display:block; margin-bottom:24px; background:var(--surface); border:1px solid var(--line); padding:16px; border-radius:var(--radius-m);}
  .mobile-filter-toggle{display:inline-flex;}
}
.empty-state{padding:70px 20px; text-align:center; color:var(--ink-soft);}
.empty-state h3{margin-bottom:10px; color:var(--ink);}

/* product detail */
.pd-layout{display:grid; grid-template-columns:1fr 1fr; gap:50px; padding:30px 0 60px;}
@media(max-width:840px){.pd-layout{grid-template-columns:1fr; gap:28px;}}
.pd-main-photo{aspect-ratio:4/5; border-radius:var(--radius-m); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.pd-main-photo svg{width:46%; height:46%; stroke:var(--gold-deep); fill:none; stroke-width:1;}
.pd-thumbs{display:flex; gap:10px;}
.pd-thumb{width:64px; height:80px; border-radius:var(--radius-s); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.pd-thumb.active{border-color:var(--gold);}
.pd-thumb svg{width:60%; height:60%; stroke:var(--gold-deep); fill:none; stroke-width:1.2;}
.pd-info h1{font-size:1.9rem; margin-bottom:8px;}
.pd-info .sku{font-size:.76rem; color:var(--ink-soft); letter-spacing:.04em;}
.pd-price{margin:18px 0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
.pd-price .now{font-size:1.7rem; font-weight:500;}
.pd-price .now.promo{color:var(--error);}
.pd-price .old{font-size:1rem; color:var(--ink-soft); text-decoration:line-through;}
.pd-desc{color:var(--ink-soft); font-size:.94rem; margin-bottom:22px; max-width:52ch;}
.opt-block{margin-bottom:20px;}
.opt-block h4{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; color:var(--ink-soft);}
.swatches{display:flex; gap:9px; flex-wrap:wrap;}
.swatch{min-width:44px; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:var(--radius-s); display:flex; align-items:center; justify-content:center; font-size:.82rem; background:var(--surface); color:var(--ink);}
.swatch.active{border-color:var(--ink); background:var(--ink); color:var(--bg);}
.swatch:disabled{opacity:.35; text-decoration:line-through; cursor:not-allowed;}
.qty-row{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
.qty-control{display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--radius-s);}
.qty-control button{width:38px; height:38px; background:none; border:none; font-size:1rem; color:var(--ink);}
.qty-control span{width:34px; text-align:center; font-size:.9rem;}
.pd-actions{display:flex; gap:12px; flex-wrap:wrap;}
.pd-meta{margin-top:26px; border-top:1px solid var(--line); padding-top:20px; font-size:.85rem; color:var(--ink-soft); display:flex; flex-direction:column; gap:8px;}
.related{padding:20px 0 60px;}

/* cart */
.cart-layout{display:grid; grid-template-columns:1fr 340px; gap:44px; padding:30px 0 70px;}
@media(max-width:840px){.cart-layout{grid-template-columns:1fr;}}
.cart-item{display:grid; grid-template-columns:84px 1fr auto; gap:16px; padding:20px 0; border-bottom:1px solid var(--line); align-items:center;}
.cart-item .thumb{width:84px; height:104px; border-radius:var(--radius-s); display:flex; align-items:center; justify-content:center;}
.cart-item .thumb svg{width:56%; height:56%; stroke:var(--gold-deep); fill:none; stroke-width:1.2;}
.cart-item h4{font-size:.94rem; margin-bottom:4px;}
.cart-item .opts{font-size:.78rem; color:var(--ink-soft); margin-bottom:8px;}
.cart-item .unit-price{font-size:.78rem; color:var(--ink-soft);}
.cart-item .right{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
.cart-item .line-total{font-weight:500;}
.remove-link{font-size:.76rem; color:var(--error); background:none; border:none;}
.summary-box{border:1px solid var(--line); border-radius:var(--radius-m); padding:26px; align-self:start; background:var(--surface);}
.summary-box h3{margin-bottom:18px; font-size:1.1rem;}
.summary-row{display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:12px; color:var(--ink-soft);}
.summary-row.total{color:var(--ink); font-size:1.05rem; font-weight:500; border-top:1px solid var(--line); padding-top:14px; margin-top:14px;}
.coupon-row{display:flex; gap:8px; margin:16px 0;}
.coupon-row input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--bg); color:var(--ink);}

/* forms */
.form-page{max-width:440px; margin:0 auto; padding:50px 0 80px;}
.form-page.wide{max-width:640px;}
.form-page h1{font-size:1.9rem; margin-bottom:8px; text-align:center;}
.form-page .sub{text-align:center; color:var(--ink-soft); font-size:.9rem; margin-bottom:32px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:7px;}
.field input, .field select, .field textarea{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--surface); color:var(--ink);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:480px){.field-row{grid-template-columns:1fr;}}
.form-foot{text-align:center; margin-top:20px; font-size:.86rem; color:var(--ink-soft);}
.form-foot a{color:var(--gold-deep); border-bottom:1px solid var(--gold-deep);}
.hint{font-size:.76rem; color:var(--ink-soft); margin-top:6px;}
.error-text{font-size:.76rem; color:var(--error); margin-top:6px;}
.alert{padding:12px 16px; border-radius:var(--radius-s); font-size:.85rem; margin-bottom:18px;}
.alert.error{background:var(--error-bg); color:var(--error);}
.alert.success{background:var(--success-bg); color:var(--success);}

/* checkout stepper */
.steps-row{display:flex; justify-content:center; gap:8px; margin-bottom:40px; flex-wrap:wrap;}
.step-pill{font-size:.74rem; padding:7px 14px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft);}
.step-pill.active{border-color:var(--ink); color:var(--ink); background:var(--blush);}
.step-pill.done{border-color:var(--gold); color:var(--gold-deep);}
.checkout-box{border:1px solid var(--line); border-radius:var(--radius-m); padding:26px; margin-bottom:20px; background:var(--surface);}
.checkout-box h3{font-size:1rem; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
.pay-option{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:var(--radius-s); padding:14px; margin-bottom:10px; cursor:pointer;}
.pay-option.active{border-color:var(--ink); background:var(--blush);}
.pay-option input{accent-color:var(--ink);}
.mini-summary-row{display:flex; justify-content:space-between; font-size:.86rem; padding:8px 0; border-bottom:1px dashed var(--line);}
.order-confirm{text-align:center; padding:60px 0;}
.order-confirm .check-circle{width:70px; height:70px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin:0 auto 22px;}
.order-confirm .check-circle svg{width:32px; height:32px; stroke:var(--success); fill:none; stroke-width:2;}

/* account */

.badge{display:inline-flex; align-items:center; padding:4px 11px; border-radius:20px; font-size:.72rem; letter-spacing:.02em;}
.badge.b-wait{background:#3D2E12; color:#F0C265;}
.badge.b-paid{background:var(--success-bg); color:var(--success);}
.badge.b-prep{background:#242C57; color:#9FB0F5;}
.badge.b-sent{background:#0F3244; color:#7FD4EF;}
.badge.b-done{background:var(--success-bg); color:var(--success);}
.badge.b-cancel{background:var(--error-bg); color:var(--error);}
.badge.on{background:var(--success-bg); color:var(--success);}
.badge.off{background:var(--error-bg); color:var(--error);}
.badge.low{background:var(--error-bg); color:var(--error);}

.admin-logout{margin-top:24px; padding-top:20px; border-top:1px solid rgba(255,255,255,.12);}
.admin-logout button{color:#B7C6E6; background:none; border:none; font-size:.82rem; display:flex; align-items:center; gap:8px;}
.admin-main{padding:30px 34px 70px; background:var(--bg); min-width:0;}

.admin-topline{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; gap:14px; flex-wrap:wrap;}

.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px;}
@media(max-width:920px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr;}}

.admin-grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:22px; margin-bottom:26px;}

@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite;}

function fmtBRL(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function installmentText(v){ const n=3; return `${n}x de ${fmtBRL(v/n)} sem juros`; }
function favKey(){ return 'sel_fav_v1'; }
function loadFavs(){ try{ const raw=localStorage.getItem(favKey()); return raw?JSON.parse(raw):[]; }catch(e){ return []; } }
function saveFavs(f){ try{ localStorage.setItem(favKey(), JSON.stringify(f)); }catch(e){} }
function toggleFav(id){
  let f = loadFavs();
  if(f.includes(id)) f = f.filter(x=>x!==id); else f.push(id);
  saveFavs(f);
  return f;
}
function toast(msg, isErr){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.innerHTML = `${icon(isErr?'close':'check')}<span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function withLoading(btn, fn, delay){
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>`;
  setTimeout(()=>{ fn(); btn.disabled=false; btn.innerHTML=original; }, delay||550);
}
function currentCustomer(){ if(!SESSION) return null; return DB.customers.find(c=>c.id===SESSION.customerId) || null; }
function statusLabel(s){

}
function statusBadgeClass(s){
  return {aguardando_pagamento:'b-wait', pagamento_aprovado:'b-paid', em_preparacao:'b-prep', enviado:'b-sent', entregue:'b-done', cancelado:'b-cancel'}[s] || '';
}
function productById(id){ return DB.products.find(p=>p.id===Number(id)); }
function activeProducts(){ return DB.products.filter(p=>p.active); }
function cartLines(){
  return CART.map(line=>{
    const p = productById(line.productId);
    if(!p) return null;
    const unit = p.promoPrice || p.price;
    return {...line, product:p, unit, lineTotal: unit*line.qty};
  }).filter(Boolean);
}
function cartCount(){ return CART.reduce((a,l)=>a+l.qty,0); }
function cartSubtotal(){ return cartLines().reduce((a,l)=>a+l.lineTotal,0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function parseHash(){
  let h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  const params = new URLSearchParams(qs||'');
  const segs = path.split('/').filter(Boolean);
  return {segs, params};
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', init);

function init(){
  loadDB(); loadCart(); loadSession(); loadAdminSession();
  render();
}

function render(){
  mobileMenuOpen = false;
  const {segs, params} = parseHash();
  const app = document.getElementById('app');
  window.scrollTo(0,0);

  if(segs[0] === 'admin'){
    app.innerHTML = renderAdminArea(segs, params);
    afterRenderAdmin(segs, params);
    return;
  }

  let body = '';
  const route = segs[0] || 'home';
  if(route === 'home') body = pageHome();
  else if(route === 'produtos') body = pageProducts(params);
  else if(route === 'produto') body = pageProductDetail(segs[1]);
  else if(route === 'carrinho') body = pageCart();
  else if(route === 'checkout') body = pageCheckout();
  else if(route === 'entrar') body = pageLogin();
  else if(route === 'cadastrar') body = pageRegister();
  else if(route === 'conta') body = pageAccount(segs[1] || 'dados');
  else if(route === 'favoritos') body = pageFavorites();
  else body = pageHome();

  app.innerHTML = `
    ${renderHeader(route, params)}
    <main>${body}</main>
    ${renderFooter()}
    ${confirmModal ? renderConfirmModal() : ''}
  `;
  afterRenderPublic(route, params, segs);
}

function productCard(p){
  const favs = loadFavs();
  const isFav = favs.includes(p.id);
  const stock = totalStock(p);
  return `
  <article class="card-product">
    <a href="#/produto/${p.id}" class="card-photo" style="background:${bgFor(p.id)}">
      ${garmentIcon(p.category)}
      ${p.isNew?'<span class="tag">Novo</span>':(p.promoPrice?'<span class="tag promo">Oferta</span>':'')}
      <button class="fav ${isFav?'active':''}" data-fav="${p.id}">${icon('heart')}</button>
    </a>
    <a href="#/produto/${p.id}">
      <div class="card-cat">${esc(p.category)}</div>
      <h3>${esc(p.name)}</h3>
      <div class="price-row">
        ${p.promoPrice?`<span class="price-old">${fmtBRL(p.price)}</span><span class="price-now promo">${fmtBRL(p.promoPrice)}</span>`:`<span class="price-now">${fmtBRL(p.price)}</span>`}
      </div>
      <div class="installment">${installmentText(p.promoPrice||p.price)}</div>
      ${stock===0?'<div class="stock-tag out">Indisponível</div>':(stock<=5?`<div class="stock-tag low">Últimas ${stock} unidades</div>`:'')}
    </a>
  </article>`;
}

  const cat = params.get('cat') || '';
  const size = params.get('size') || '';
  const min = params.get('min') || '';
  const max = params.get('max') || '';
  const sort = params.get('sort') || '';
  const q = (params.get('q')||'').toLowerCase().trim();
  const isNew = params.get('novo');
  const isPromo = params.get('promo');

  if(cat) list = list.filter(p=>p.category===cat);
  if(size) list = list.filter(p=>p.sizes.includes(size));
  if(min) list = list.filter(p=>(p.promoPrice||p.price) >= parseFloat(min));
  if(max) list = list.filter(p=>(p.promoPrice||p.price) <= parseFloat(max));
  if(q) list = list.filter(p=>p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
  if(isNew) list = list.filter(p=>p.isNew);
  if(isPromo) list = list.filter(p=>p.promoPrice);

  if(sort==='menor') list = [...list].sort((a,b)=>(a.promoPrice||a.price)-(b.promoPrice||b.price));
  else if(sort==='maior') list = [...list].sort((a,b)=>(b.promoPrice||b.price)-(a.promoPrice||a.price));
  else if(sort==='novidades') list = [...list].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0));

  const allSizes = [...new Set(DB.products.flatMap(p=>p.sizes))].sort();

  return `
  <div class="wrap">
    <div class="crumbs"><a href="#/home">Início</a> / <span>${cat?esc(cat):(isPromo?'Promoções':(isNew?'Novidades':'Produtos'))}</span></div>
    <div class="section-head" style="margin-top:16px;">
      <div><h2>${cat?esc(cat):(isPromo?'Promoções':(isNew?'Novidades':'Todos os produtos'))}</h2><p>${list.length} produto(s) encontrado(s)</p></div>
      <button class="btn btn-outline btn-sm mobile-filter-toggle" id="toggleFilters">Filtros</button>
    </div>
    <div class="shop-layout">
      <aside class="filters ${mobileFiltersOpen?'open':''}" id="filtersPanel">
        <div class="filter-group">
          <h4>Categoria</h4>
          <label class="filter-opt"><input type="radio" name="fcat" value="" ${!cat?'checked':''}> Todas</label>
          ${DB.categories.map(c=>`<label class="filter-opt"><input type="radio" name="fcat" value="${esc(c)}" ${cat===c?'checked':''}> ${esc(c)}</label>`).join('')}
        </div>
        <div class="filter-group">
          <h4>Tamanho</h4>
          <label class="filter-opt"><input type="radio" name="fsize" value="" ${!size?'checked':''}> Todos</label>
          ${allSizes.map(s=>`<label class="filter-opt"><input type="radio" name="fsize" value="${esc(s)}" ${size===s?'checked':''}> ${esc(s)}</label>`).join('')}
        </div>
        <div class="filter-group">
          <h4>Preço</h4>
          <div class="price-inputs">
            <input type="number" id="fmin" placeholder="Mín" value="${esc(min)}">
            <span>—</span>
            <input type="number" id="fmax" placeholder="Máx" value="${esc(max)}">
          </div>
          <button class="btn btn-outline btn-sm" style="margin-top:12px;width:100%" id="applyPrice">Aplicar</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="clearFilters">Limpar filtros</button>
      </aside>
      <div>
        <div class="shop-toolbar">
          <span class="result-count">${list.length} resultado(s)</span>
          <select id="sortSelect">
            <option value="">Ordenar por</option>
            <option value="novidades" ${sort==='novidades'?'selected':''}>Novidades</option>
            <option value="menor" ${sort==='menor'?'selected':''}>Menor preço</option>
            <option value="maior" ${sort==='maior'?'selected':''}>Maior preço</option>
          </select>
        </div>
        ${list.length ? `<div class="grid-products">${list.map(productCard).join('')}</div>` : `<div class="empty-state"><h3>Nenhum produto encontrado</h3><p>Tente ajustar os filtros de busca.</p></div>`}
      </div>
    </div>
  </div>`;
}

            </div>

              <div class="line-total">${fmtBRL(l.lineTotal)}</div>
              <div class="qty-control">
                <button data-cartminus="${i}" type="button">−</button>
                <span>${l.qty}</span>
                <button data-cartplus="${i}" type="button">+</button>
              </div>
              <button class="remove-link" data-cartremove="${i}">Remover</button>

          <a href="#/produtos" class="btn btn-outline">← Continuar comprando</a>

      <div class="summary-box">
        <h3>Resumo do pedido</h3>
        <div class="summary-row"><span>Subtotal</span><span>${fmtBRL(subtotal)}</span></div>
        <div class="summary-row"><span>Frete</span><span>${shipping===0?'Grátis':fmtBRL(shipping)}</span></div>
        ${discount>0?`<div class="summary-row"><span>Cupom ${esc(checkoutData.coupon.code)}</span><span>−${fmtBRL(discount)}</span></div>`:''}

          <button class="btn btn-outline btn-sm" id="applyCoupon">Aplicar</button>

        <button class="btn btn-block" id="goCheckout" style="margin-top:16px;">Finalizar compra</button>

    </div>`}
  </div>`;
}

    <div style="display:flex;gap:12px;">
      <button class="btn btn-outline" id="backStep2">Voltar</button>
      <button class="btn btn-block" id="nextStep2">Continuar</button>
    </div>
    `:''}

    ${checkoutStep===3?`
    <div class="checkout-box">
      <h3>Forma de pagamento</h3>
      <label class="pay-option ${checkoutData.paymentMethod==='Pix'?'active':''}"><input type="radio" name="pay" value="Pix" ${checkoutData.paymentMethod==='Pix'?'checked':''}> Pix — aprovação imediata</label>
      <label class="pay-option ${checkoutData.paymentMethod==='Cartão de crédito'?'active':''}"><input type="radio" name="pay" value="Cartão de crédito" ${checkoutData.paymentMethod==='Cartão de crédito'?'checked':''}> Cartão de crédito — em até 3x sem juros</label>
      <label class="pay-option ${checkoutData.paymentMethod==='Boleto'?'active':''}"><input type="radio" name="pay" value="Boleto" ${checkoutData.paymentMethod==='Boleto'?'checked':''}> Boleto bancário — compensação em até 3 dias úteis</label>
      <p class="hint">Ambiente pronto para integração com um gateway de pagamento real (Pix, cartão e boleto).</p>
    </div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-outline" id="backStep3">Voltar</button>
      <button class="btn btn-block" id="nextStep3">Continuar</button>
    </div>
    `:''}

    ${checkoutStep===4?`
    <div class="checkout-box">
      <h3>Resumo do pedido</h3>
      ${lines.map(l=>`<div class="mini-summary-row"><span>${esc(l.product.name)} (${esc(l.size)}/${esc(l.color)}) x${l.qty}</span><span>${fmtBRL(l.lineTotal)}</span></div>`).join('')}
      <div class="mini-summary-row"><span>Frete</span><span>${shipping===0?'Grátis':fmtBRL(shipping)}</span></div>
      ${discount>0?`<div class="mini-summary-row"><span>Cupom ${esc(checkoutData.coupon.code)}</span><span>−${fmtBRL(discount)}</span></div>`:''}
      <div class="mini-summary-row" style="font-weight:500;border-bottom:none;font-size:1.05rem;"><span>Total</span><span>${fmtBRL(total)}</span></div>
      <p style="font-size:.85rem;color:var(--ink-soft);margin-top:10px;">Pagamento: ${esc(checkoutData.paymentMethod)} · Entrega: ${esc(addr.street)}</p>
    </div>
    <div style="display:flex;gap:12px;">
      <button class="btn btn-outline" id="backStep4">Voltar</button>
      <button class="btn btn-block" id="confirmOrder">Confirmar compra</button>
    </div>
    `:''}
  </div>`;
}

function pageOrderConfirm(orderId){

/* ============================= PUBLIC EVENT BINDING ============================= */
function afterRenderPublic(route, params, segs){
  const burger = document.getElementById('burgerBtn');
  if(burger) burger.onclick = ()=>{ document.getElementById('mobileMenu').classList.toggle('open'); };
  const hs = document.getElementById('headerSearch');
  if(hs) hs.onkeydown = e=>{ if(e.key==='Enter') go('/produtos?q='+encodeURIComponent(hs.value)); };
  const ms = document.getElementById('mobileSearch');
  if(ms) ms.onkeydown = e=>{ if(e.key==='Enter') go('/produtos?q='+encodeURIComponent(ms.value)); };

  document.querySelectorAll('[data-fav]').forEach(b=>{
    b.onclick = e=>{ e.preventDefault(); const id = Number(b.dataset.fav); toggleFav(id); render(); toast('Favoritos atualizados'); };
  });

  if(route==='produtos'){
    document.querySelectorAll('input[name=fcat]').forEach(r=>r.onchange=()=>updateParam('cat', r.value));
    document.querySelectorAll('input[name=fsize]').forEach(r=>r.onchange=()=>updateParam('size', r.value));
    const applyPrice = document.getElementById('applyPrice');
    if(applyPrice) applyPrice.onclick = ()=>{
      const min = document.getElementById('fmin').value; const max = document.getElementById('fmax').value;
      const p = parseHash().params; if(min) p.set('min',min); else p.delete('min'); if(max) p.set('max',max); else p.delete('max');
      go('/produtos?'+p.toString());
    };
    const sortSel = document.getElementById('sortSelect');
    if(sortSel) sortSel.onchange = ()=>updateParam('sort', sortSel.value);
    const clearBtn = document.getElementById('clearFilters');
    if(clearBtn) clearBtn.onclick = ()=>go('/produtos');
    const toggleF = document.getElementById('toggleFilters');
    if(toggleF) toggleF.onclick = ()=>{ mobileFiltersOpen = !mobileFiltersOpen; render(); };
  }

  if(route==='produto'){
    const p = productById(segs[1]);
    if(p){
      const sel = pdSelected[p.id];
      document.querySelectorAll('#sizeSwatches [data-size]').forEach(b=>{
        b.onclick = ()=>{ sel.size = b.dataset.size; sel.qty=1; render(); };
      });
      document.querySelectorAll('#colorSwatches [data-color]').forEach(b=>{
        b.onclick = ()=>{ sel.color = b.dataset.color; render(); };
      });
      const qMinus = document.getElementById('qtyMinus'), qPlus = document.getElementById('qtyPlus');
      if(qMinus) qMinus.onclick = ()=>{ if(sel.qty>1){ sel.qty--; render(); } };
      if(qPlus) qPlus.onclick = ()=>{ const max=(p.stockBySize[sel.size]||1); if(sel.qty<max){ sel.qty++; render(); } };
      const addBtn = document.getElementById('addCartBtn');
      if(addBtn) addBtn.onclick = ()=>{ withLoading(addBtn, ()=>{ addToCart(p.id, sel.size, sel.color, sel.qty); toast('Produto adicionado ao carrinho'); }, 400); };
      const buyBtn = document.getElementById('buyNowBtn');
      if(buyBtn) buyBtn.onclick = ()=>{ addToCart(p.id, sel.size, sel.color, sel.qty); go('/checkout'); };
    }
  }

  if(route==='carrinho'){
    document.querySelectorAll('[data-cartminus]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.cartminus); if(CART[i].qty>1){ CART[i].qty--; saveCart(); render(); } });
    document.querySelectorAll('[data-cartplus]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.cartplus); const p=productById(CART[i].productId); const max=(p.stockBySize[CART[i].size]||99); if(CART[i].qty<max){ CART[i].qty++; saveCart(); render(); } else { toast('Estoque insuficiente', true); } });
    document.querySelectorAll('[data-cartremove]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.cartremove); CART.splice(i,1); saveCart(); render(); toast('Produto removido'); });
    const applyCoupon = document.getElementById('applyCoupon');
    if(applyCoupon) applyCoupon.onclick = ()=>{
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      const c = DB.coupons.find(x=>x.code===code && x.active);
      if(c){ checkoutData.coupon = c; toast('Cupom aplicado com sucesso'); } else { toast('Cupom inválido', true); }
      render();
    };
    const goCheckout = document.getElementById('goCheckout');
    if(goCheckout) goCheckout.onclick = ()=>{ checkoutStep=1; go('/checkout'); };
  }

  if(route==='entrar'){
    document.getElementById('loginForm').onsubmit = e=>{
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const pass = document.getElementById('loginPassword').value;
      const c = DB.customers.find(x=>x.email.toLowerCase()===email);
      const box = document.getElementById('loginAlert');
      if(!c){ box.innerHTML = `<div class="alert error">E-mail não encontrado.</div>`; return; }
      if(!c.active){ box.innerHTML = `<div class="alert error">Esta conta está desativada. Entre em contato com a loja.</div>`; return; }
      if(c.password !== pass){ box.innerHTML = `<div class="alert error">Senha incorreta.</div>`; return; }
      SESSION = {customerId:c.id}; saveSession();
      toast('Bem-vinda de volta, '+c.name.split(' ')[0]+'!');
      go('/conta/dados');
    };
    const fl = document.getElementById('forgotLink');
    if(fl) fl.onclick = e=>{ e.preventDefault(); toast('Um link de recuperação foi enviado para seu e-mail (demonstração).'); };
  }

  if(route==='cadastrar'){
    document.getElementById('registerForm').onsubmit = e=>{
      e.preventDefault();
      const email = document.getElementById('regEmail').value.trim();
      const box = document.getElementById('regAlert');
      if(DB.customers.some(c=>c.email.toLowerCase()===email.toLowerCase())){
        box.innerHTML = `<div class="alert error">Já existe uma conta com este e-mail.</div>`; return;
      }
      const newCust = {
        id: DB.nextCustomerId++,
        name: document.getElementById('regName').value.trim(),
        email, phone: document.getElementById('regPhone').value.trim(),
        cpf: document.getElementById('regCpf').value.trim(),
        password: document.getElementById('regPassword').value,
        active:true,
        addresses:[{label:'Casa', street:document.getElementById('regAddress').value.trim(), city:'', state:'', zip:''}]
      };
      DB.customers.push(newCust); saveDB();
      SESSION = {customerId:newCust.id}; saveSession();
      toast('Conta criada com sucesso!');
      go('/conta/dados');
    };
  }

  if(route==='conta'){
    const tab = segs[1]||'dados';
    const logoutLink = document.getElementById('logoutLink');
    if(logoutLink) logoutLink.onclick = e=>{ e.preventDefault(); SESSION=null; saveSession(); toast('Você saiu da sua conta'); go('/home'); };

    if(tab==='dados'){
      document.getElementById('dadosForm').onsubmit = e=>{
        e.preventDefault(); const c = currentCustomer();
        c.name = document.getElementById('dName').value; c.email = document.getElementById('dEmail').value;
        c.phone = document.getElementById('dPhone').value; c.cpf = document.getElementById('dCpf').value;
        saveDB(); document.getElementById('dadosAlert').innerHTML = `<div class="alert success">Dados atualizados com sucesso.</div>`;
      };
    }
    if(tab==='enderecos'){
      document.getElementById('addAddressForm').onsubmit = e=>{
        e.preventDefault(); const c = currentCustomer();
        c.addresses.push({label:document.getElementById('aLabel').value, street:document.getElementById('aStreet').value, city:document.getElementById('aCity').value, state:document.getElementById('aState').value, zip:document.getElementById('aZip').value});
        saveDB(); toast('Endereço adicionado'); render();
      };
    }
    if(tab==='pedidos'){
      document.querySelectorAll('[data-vieworder]').forEach(b=>{
        b.onclick = ()=>{ const o = DB.orders.find(x=>x.id===Number(b.dataset.vieworder)); document.getElementById('orderDetailArea').innerHTML = orderDetailHTML(o); };
      });
    }
    if(tab==='senha'){
      document.getElementById('pwForm').onsubmit = e=>{
        e.preventDefault(); const c = currentCustomer(); const box = document.getElementById('pwAlert');
        const oldV = document.getElementById('pwOld').value, newV = document.getElementById('pwNew').value, confV = document.getElementById('pwConfirm').value;
        if(c.password !== oldV){ box.innerHTML = `<div class="alert error">Senha atual incorreta.</div>`; return; }
        if(newV !== confV){ box.innerHTML = `<div class="alert error">As senhas não coincidem.</div>`; return; }
        c.password = newV; saveDB(); box.innerHTML = `<div class="alert success">Senha atualizada com sucesso.</div>`;
      };
    }
    if(tab==='contato'){
      document.getElementById('contatoForm').onsubmit = e=>{
        e.preventDefault(); document.getElementById('contatoAlert').innerHTML = `<div class="alert success">Mensagem enviada! Retornaremos em breve.</div>`; e.target.reset();
      };
    }
  }

  if(route==='checkout'){
    const lines = cartLines(); if(lines.length===0) return;
    const n1 = document.getElementById('nextStep1'); if(n1) n1.onclick = ()=>{ checkoutStep=2; render(); };
    const b2 = document.getElementById('backStep2'); if(b2) b2.onclick = ()=>{ checkoutStep=1; render(); };
    const n2 = document.getElementById('nextStep2'); if(n2) n2.onclick = ()=>{ checkoutStep=3; render(); };
    const b3 = document.getElementById('backStep3'); if(b3) b3.onclick = ()=>{ checkoutStep=2; render(); };
    document.querySelectorAll('input[name=pay]').forEach(r=>r.onchange=()=>{ checkoutData.paymentMethod=r.value; render(); });
    const n3 = document.getElementById('nextStep3'); if(n3) n3.onclick = ()=>{ checkoutStep=4; render(); };
    const b4 = document.getElementById('backStep4'); if(b4) b4.onclick = ()=>{ checkoutStep=3; render(); };
    const conf = document.getElementById('confirmOrder');
    if(conf) conf.onclick = ()=>{
      withLoading(conf, ()=>{
        const cust = currentCustomer();
        const orderId = DB.nextOrderId++;
        const addr = cust.addresses[0];
        DB.orders.push({
          id: orderId, customerId: cust.id, date: new Date().toISOString().slice(0,10),
          items: lines.map(l=>({productId:l.product.id, size:l.size, color:l.color, qty:l.qty, price:l.unit})),
          shipping: cartSubtotal()>=299?0:19.90, payment: checkoutData.paymentMethod,
          address: `${addr.street} - ${addr.city}/${addr.state}`, status:'aguardando_pagamento'
        });
        lines.forEach(l=>{ const p = productById(l.product.id); if(p.stockBySize[l.size]!=null) p.stockBySize[l.size] = Math.max(0, p.stockBySize[l.size]-l.qty); });
        saveDB();
        CART = []; saveCart(); checkoutData = {paymentMethod:'Pix', coupon:null}; checkoutStep=1;
        document.getElementById('app').querySelector('main').innerHTML = pageOrderConfirm(orderId);
        window.scrollTo(0,0);
      }, 900);
    };
  }
}

function updateParam(key, value){
  const p = parseHash().params;
  if(value) p.set(key, value); else p.delete(key);
  go('/produtos?'+p.toString());
}
function addToCart(productId, size, color, qty){
  const existing = CART.find(l=>l.productId===productId && l.size===size && l.color===color);
  if(existing) existing.qty += qty; else CART.push({productId, size, color, qty});
  saveCart();
}

function adminDashboard(){
  const totalVendas = DB.orders.filter(o=>o.status!=='cancelado').reduce((a,o)=>a+orderTotal(o),0);
  const now = new Date();
  const monthStr = now.toISOString().slice(0,7);
  const vendasMes = DB.orders.filter(o=>o.status!=='cancelado' && o.date.startsWith(monthStr)).reduce((a,o)=>a+orderTotal(o),0);
  const qtdPedidos = DB.orders.length;
  const produtosCadastrados = DB.products.length;
  const clientesCadastrados = DB.customers.length;
  const lowStock = DB.products.filter(p=>totalStock(p)>0 && totalStock(p)<=DB.settings.minStockAlert);
  const recentOrders = [...DB.orders].sort((a,b)=>b.id-a.id).slice(0,5);

  const last6 = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('pt-BR',{month:'short'});
    const val = DB.orders.filter(o=>o.status!=='cancelado' && o.date.startsWith(key)).reduce((a,o)=>a+orderTotal(o),0);
    last6.push({label, val});
  }
  const maxVal = Math.max(...last6.map(x=>x.val), 1);

  return `
  <div class="admin-topline">
    <div><h1>Dashboard</h1><div class="sub">Visão geral da loja Sol e Lua Store</div></div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total de vendas</div><div class="val">${fmtBRL(totalVendas)}</div></div>
    <div class="kpi-card"><div class="lbl">Vendas do mês</div><div class="val">${fmtBRL(vendasMes)}</div></div>
    <div class="kpi-card"><div class="lbl">Pedidos</div><div class="val">${qtdPedidos}</div></div>
    <div class="kpi-card"><div class="lbl">Clientes cadastrados</div><div class="val">${clientesCadastrados}</div></div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Produtos cadastrados</div><div class="val">${produtosCadastrados}</div></div>
    <div class="kpi-card"><div class="lbl">Estoque baixo</div><div class="val">${lowStock.length}</div></div>
    <div class="kpi-card"><div class="lbl">Ticket médio</div><div class="val">${fmtBRL(qtdPedidos? totalVendas/qtdPedidos : 0)}</div></div>

/* ---- Admin event binding ---- */
function afterRenderAdmin(segs, params){
  if(segs[1]==='entrar' || !isAdminLoggedIn()){
    const form = document.getElementById('adminLoginForm');
    if(form) form.onsubmit = e=>{
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPassword').value;
      const box = document.getElementById('adminLoginAlert');
      if(email===ADMIN_CRED.email && pass===ADMIN_CRED.password){
        ADMIN_SESSION = true; saveAdminSession();
        toast('Login administrativo realizado com sucesso');
        go('/admin/dashboard');
      } else {
        box.innerHTML = `<div class="alert error">Credenciais inválidas.</div>`;
      }
    };
    return;
  }

  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ ADMIN_SESSION=false; saveAdminSession(); go('/admin/entrar'); };

  const section = segs[1] || 'dashboard';

  if(section==='produtos' && !segs[2]){
    const search = document.getElementById('prodSearch');
    if(search) search.oninput = ()=>{ adminProductQuery = search.value; renderAdminOnly(); };
    document.getElementById('newProductBtn').onclick = ()=>{ adminModal = {type:'product', product:null}; renderAdminOnly(); };
    document.querySelectorAll('[data-editproduct]').forEach(b=>b.onclick=()=>{ adminModal = {type:'product', product: productById(Number(b.dataset.editproduct))}; renderAdminOnly(); });
    document.querySelectorAll('[data-delproduct]').forEach(b=>b.onclick=()=>{
      const id = Number(b.dataset.delproduct);
      askConfirm('Excluir produto', 'Tem certeza que deseja excluir este produto? Esta ação não pode ser desfeita.', ()=>{
        DB.products = DB.products.filter(p=>p.id!==id); saveDB(); confirmModal=null; renderAdminOnly(); toast('Produto excluído');
      });
    });
    document.querySelectorAll('[data-toggleactive]').forEach(b=>b.onclick=()=>{
      const p = productById(Number(b.dataset.toggleactive)); p.active = !p.active; saveDB(); renderAdminOnly();
      toast(p.active?'Produto ativado':'Produto desativado');
    });
  }

  if(section==='pedidos' && segs[2]){
    const btn = document.getElementById('saveOrderStatus');
    if(btn) btn.onclick = ()=>{
      const o = DB.orders.find(x=>x.id===Number(btn.dataset.orderid));
      o.status = document.getElementById('orderStatusSelect').value;
      saveDB(); toast('Status do pedido atualizado'); renderAdminOnly();
    };
  } else if(section==='pedidos'){
    const sel = document.getElementById('orderFilterSelect');
    if(sel) sel.onchange = ()=>{ adminOrderFilter = sel.value; renderAdminOnly(); };
  }

  if(section==='clientes'){
    const search = document.getElementById('custSearch');
    if(search) search.oninput = ()=>{ adminCustomerQuery = search.value; renderAdminOnly(); };
    document.querySelectorAll('[data-viewcust]').forEach(b=>b.onclick=()=>{
      const c = DB.customers.find(x=>x.id===Number(b.dataset.viewcust));
      document.getElementById('custDetailArea').innerHTML = customerDetailHTML(c);
    });
    document.querySelectorAll('[data-togglecust]').forEach(b=>b.onclick=()=>{
      const c = DB.customers.find(x=>x.id===Number(b.dataset.togglecust)); c.active = !c.active; saveDB(); renderAdminOnly();
      toast(c.active?'Cliente ativado':'Cliente desativado');
    });
  }

  if(section==='categorias'){
    document.getElementById('newCategoryBtn').onclick = ()=>{ adminModal = {type:'category', value:'', editing:false}; renderAdminOnly(); };
    document.querySelectorAll('[data-editcat]').forEach(b=>b.onclick=()=>{ adminModal = {type:'category', value:b.dataset.editcat, editing:true, original:b.dataset.editcat}; renderAdminOnly(); });
    document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{
      const cat = b.dataset.delcat;
      askConfirm('Excluir categoria', `Excluir a categoria "${cat}"? Produtos vinculados não serão excluídos.`, ()=>{
        DB.categories = DB.categories.filter(c=>c!==cat); saveDB(); confirmModal=null; renderAdminOnly(); toast('Categoria excluída');
      });
    });
  }

  if(section==='promocoes'){
    const nb = document.getElementById('newCouponBtn');
    if(nb) nb.onclick = ()=>{ adminModal = {type:'coupon'}; renderAdminOnly(); };
  }

  if(section==='configuracoes'){
    document.getElementById('settingsForm').onsubmit = e=>{
      e.preventDefault();
      Object.assign(DB.settings, {
        storeName: document.getElementById('sName').value, email: document.getElementById('sEmail').value,
        phone: document.getElementById('sPhone').value, whatsapp: document.getElementById('sWhats').value,
        instagram: document.getElementById('sInsta').value, address: document.getElementById('sAddress').value,
        hours: document.getElementById('sHours').value, shippingInfo: document.getElementById('sShipInfo').value,
        policies: document.getElementById('sPolicies').value, minStockAlert: Number(document.getElementById('sMinStock').value)||5,
      });
      saveDB(); toast('Configurações salvas com sucesso');
    };
  }

  bindAdminModalEvents();
  bindConfirmModalEvents(true);
}

function renderAdminOnly(){
  const {segs, params} = parseHash();
  document.getElementById('app').innerHTML = renderAdminArea(segs, params);
  afterRenderAdmin(segs, params);
}

function bindAdminModalEvents(){
  const overlay = document.getElementById('adminModalOverlay');
  if(!overlay) return;
  overlay.onclick = e=>{ if(e.target===overlay){ adminModal=null; renderAdminOnly(); } };

  const pf = document.getElementById('productForm');
  if(pf){
    document.getElementById('cancelProductForm').onclick = ()=>{ adminModal=null; renderAdminOnly(); };
    pf.onsubmit = e=>{
      e.preventDefault();
      const sizes = document.getElementById('pfSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
      const colors = document.getElementById('pfColors').value.split(',').map(s=>s.trim()).filter(Boolean);
      const stockRaw = document.getElementById('pfStock').value.split(',').map(s=>s.trim()).filter(Boolean);
      const stockBySize = {};
      sizes.forEach(s=>stockBySize[s]=0);
      stockRaw.forEach(pair=>{ const [k,v] = pair.split(':').map(x=>x.trim()); if(k) stockBySize[k]=Number(v)||0; });
      const data = {
        sku: document.getElementById('pfSku').value.trim(),
        name: document.getElementById('pfName').value.trim(),
        category: document.getElementById('pfCategory').value,
        price: parseFloat(document.getElementById('pfPrice').value)||0,
        promoPrice: document.getElementById('pfPromo').value ? parseFloat(document.getElementById('pfPromo').value) : null,
        description: document.getElementById('pfDesc').value.trim(),
        sizes, colors, stockBySize,
        isNew: document.getElementById('pfIsNew').checked,
        bestSeller: document.getElementById('pfBest').checked,
      };
      if(adminModal.product){
        Object.assign(adminModal.product, data);
        toast('Produto atualizado com sucesso');
      } else {
        DB.products.push({id: DB.nextProductId++, active:true, ...data});
        toast('Produto cadastrado com sucesso');
      }
      saveDB(); adminModal=null; renderAdminOnly();
    };
  }
  const cf = document.getElementById('categoryForm');
  if(cf){
    document.getElementById('cancelCategoryForm').onclick = ()=>{ adminModal=null; renderAdminOnly(); };
    cf.onsubmit = e=>{
      e.preventDefault();
      const val = document.getElementById('catName').value.trim();
      if(adminModal.editing){
        const idx = DB.categories.indexOf(adminModal.original);
        if(idx>-1) DB.categories[idx] = val;
        DB.products.forEach(p=>{ if(p.category===adminModal.original) p.category = val; });
        toast('Categoria atualizada');
      } else {
        if(!DB.categories.includes(val)) DB.categories.push(val);
        toast('Categoria criada');
      }
      saveDB(); adminModal=null; renderAdminOnly();
    };
  }
  const cpf = document.getElementById('couponForm');
  if(cpf){
    document.getElementById('cancelCouponForm').onclick = ()=>{ adminModal=null; renderAdminOnly(); };
    cpf.onsubmit = e=>{
      e.preventDefault();
      DB.coupons.push({
        code: document.getElementById('cCode').value.trim().toUpperCase(),
        percent: Number(document.getElementById('cPercent').value),
        validFrom: document.getElementById('cFrom').value, validTo: document.getElementById('cTo').value, active:true
      });
      saveDB(); adminModal=null; renderAdminOnly(); toast('Cupom criado com sucesso');
    };
  }
  const closeCust = document.getElementById('closeCustModal');
  if(closeCust) closeCust.onclick = ()=>{ adminModal=null; renderAdminOnly(); };
}

function bindConfirmModalEvents(isAdmin){
  const overlay = document.getElementById('confirmOverlay');
  if(!overlay) return;
  document.getElementById('confirmCancel').onclick = ()=>{ confirmModal=null; isAdmin?renderAdminOnly():render(); };
  document.getElementById('confirmOk').onclick = ()=>{ const fn = confirmModal.onConfirm; if(fn) fn(); };
  overlay.onclick = e=>{ if(e.target===overlay){ confirmModal=null; isAdmin?renderAdminOnly():render(); } };
}

/* also bind confirm modal on public pages */
const origRenderPublicAfter = afterRenderPublic;
afterRenderPublic = function(route, params, segs){
  origRenderPublicAfter(route, params, segs);
  bindConfirmModalEvents(false);
};
</script>
